name: Post tech news

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs by several minutes; that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

# Never let two runs overlap (they'd both post the same stories).
concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit state/seen.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Gemini's free tier occasionally takes 1-2 minutes per call
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, summarize, post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}   # empty = the bot's default for whichever key is set
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '4' }}
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE }}
        run: python news_bot.py

      # Runs even if the post step failed, so stories already posted aren't posted again.
      - name: Save seen-stories state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add state/
            git commit -m "Update seen stories [skip ci]"
            # If someone pushed (e.g. edited a file on GitHub) during the run, a plain push would be
            # rejected and the bot would forget what it just posted, then repost it next run.
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 5
            done
            echo "::error::Could not save state/seen.json; the next run may repost these stories"
            exit 1
          fi
