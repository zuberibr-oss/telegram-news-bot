name: Post news

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs by several minutes; that's normal.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

# Never let two runs overlap (they'd both post the same stories).
concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit state/*.json back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # two channels; Gemini's free tier occasionally takes 1-2 minutes per call
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MODEL: ${{ vars.MODEL }}   # empty = the bot's default for whichever key is set
    steps:
      # Check out the branch tip, not the commit that triggered the run. A run that waited in the
      # queue behind another would otherwise start from state/ as it was before that run's posts
      # and post the same stories again.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tech channel - fetch, summarize, post
        env:
          NEWS_PROFILE: tech
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Selective channel: major stories only, at most 5 a day, one per run so they spread out.
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '1' }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '5' }}
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE }}
        run: python news_bot.py

      # Runs even if the tech step failed; one channel's trouble must not silence the other.
      - name: Main channel - fetch, summarize, post
        if: ${{ !cancelled() }}
        env:
          NEWS_PROFILE: main
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL_MAIN || '@enxmain' }}
          # A key from a second Google project gives this channel its own free daily quota.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_MAIN || secrets.GEMINI_API_KEY }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN_MAIN || '4' }}
          MAX_AGE_HOURS: "24"   # general news goes stale faster than tech
          CHANNEL_SIGNATURE: ${{ vars.CHANNEL_SIGNATURE_MAIN }}
        run: python news_bot.py

      # Runs even if a post step failed, so stories already posted aren't posted again.
      - name: Save seen-stories state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name  "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add state/
            git commit -m "Update seen stories [skip ci]"
            # If someone pushed (e.g. edited a file on GitHub) during the run, a plain push would be
            # rejected and the bot would forget what it just posted, then repost it next run.
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              sleep 5
            done
            echo "::error::Could not save state/*.json; the next run may repost these stories"
            exit 1
          fi
